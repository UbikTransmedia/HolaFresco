  <meta name="theme-color" content="#c4552d">
  <script>
    /* Aplica el tema guardado antes de pintar para evitar parpadeos. Por defecto: claro. */
    (function () {
      try {
        var a = JSON.parse(localStorage.getItem("recetador.ajustes") || "{}");
        var t = a.tema || "claro";
        if (t === "sistema") t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "oscuro" : "claro";
        var mapa = { claro: "light", oscuro: "dark", huerta: "huerta", oceano: "oceano", contraste: "contraste" };
        document.documentElement.setAttribute("data-theme", mapa[t] || "light");
      } catch (e) {}
    })();
  </script>
